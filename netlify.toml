[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NETLIFY_BUILD_BASE_IMAGE = "noble"
  # Next 16 needs Node 20.9+. Pin the LTS line so the site never builds on whatever version Netlify first
  # recorded for it.
  NODE_VERSION = "24"

# No catch-all rewrite to /index.html: every route is a real file in out/, and Netlify answers any other
# path with out/404.html and a 404 status. A catch-all would show the homepage instead, so a mistyped
# Stan Scribe link from the App Store would land on the portfolio.
