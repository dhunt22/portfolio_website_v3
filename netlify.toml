[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NETLIFY_BUILD_BASE_IMAGE = "noble"
  # Next 16 needs Node 20.9+. Pin the LTS line so the site never builds on whatever version Netlify first
  # recorded for it.
  NODE_VERSION = "24"

# No catch-all rewrite to /index.html: every route is a real file in out/, and Netlify answers any other
# path with out/404.html and a 404 status. A catch-all would show the homepage instead, so a mistyped
# Stan Scribe link from the App Store would land on the portfolio.

# App Store Connect links /stanscribe/ and /stanscribe-light/, the pages' canonical URLs. Netlify's pretty
# URLs would 301 them to the slashless page, so serve the copies scripts/stanscribe-index.mjs makes.
[[redirects]]
  from = "/stanscribe/"
  to = "/stanscribe/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/stanscribe-light/"
  to = "/stanscribe-light/index.html"
  status = 200
  force = true
